# Single source of truth for the ghostty native pin.
#
# The pinned commit, the vendored src/bindings.rs, and the prebuilt artifacts
# must always move together, in one PR. Bump procedure:
# docs/ghostty-migration/build-strategy.md, section 7.

commit = "a887df42c56f6de86c0fe6da9c4eeca37931e083"
release = "ghostty-a887df42c5"
# owner/name of the repo hosting prebuilt releases; upstream handoff = GitHub
# repo transfer (preserves assets and hashes) + editing this line.
prebuilt_repo = "xipeng-jin/libghostty-vt-prebuilt"

# sha256 over the installed C headers (include/ghostty/**) at the pinned
# commit. Stamped by `cargo run -p ghostty_vt_sys --features bindgen-tool
# --bin gen-bindings`; verified by build.rs on pinned source builds so a pin
# bump without regenerated bindings cannot land silently.
headers_sha256 = "4c87c8f9587bbd48f7dd723b76bb3cd730a0b7537e4bc684ed87bf59bdc3d19f"

# Per-target sha256 of the prebuilt libghostty-vt release assets
# (libghostty-vt-<commit10>-<target>.tar.gz), the sole build-time trust root
# for the default prebuilt fetch. Stamped from the release's SHA256SUMS after
# `gh attestation verify` (bump procedure: build-strategy.md §7).
[sha256]
x86_64-unknown-linux-gnu = "47896301eb32f113169385815b469a7534cc90b32ac6136aaa744e0d4fd38530"
aarch64-unknown-linux-gnu = "fbe83b84646c8100e5e1580f4daf20a6eb3a85ece838c137bc7c0d55c0082412"
x86_64-unknown-linux-musl = "2f5c46ced9f497421f925a446eec7196d286177f1f6b180ff5314a864ae4333b"
aarch64-unknown-linux-musl = "053a1be4760e3bbd8be865b72f07fb8d51a5b636123b991ef635961b927cb3b4"
