# Single source of truth for the ghostty native pin.
#
# The pinned commit, the vendored src/bindings.rs, and the prebuilt artifacts
# must always move together, in one PR. Bump procedure:
# docs/ghostty-migration/build-strategy.md, section 7.

commit = "8867c37c55b578b9eb4cfaba41cb9023e557176d"
release = "ghostty-8867c37c55"
source_repo = "ghostty-org/ghostty"
# owner/name of the repo hosting prebuilt releases; upstream handoff = GitHub
# repo transfer (preserves assets and hashes) + editing this line.
prebuilt_repo = "xipeng-jin/libghostty-vt-prebuilt"

# ghostty's minimum_zig_version at `commit`. build.rs enforces ghostty's own
# requireZig rule on source builds: same major.minor, patch >= this.
zig = "0.16.0"
# -Dcpu used for the published prebuilts and, by default, every source build
# (LIBGHOSTTY_VT_SYS_CPU overrides source builds only).
cpu = "baseline"
# -Dvt-features passed by the publish workflow AND every source build, so a
# source build can never link a different feature set than the prebuilt it
# replaces. The C headers and src/bindings.rs still declare the trimmed
# symbols; the safe crate keeps them behind cargo features that default off.
vt_features = "-kitty_graphics,-glyph_protocol"

# sha256 over the installed C headers (include/ghostty/**) at the pinned
# commit. Stamped by `cargo run -p ghostty_vt_sys --features bindgen-tool
# --bin gen-bindings`; verified by build.rs on pinned source builds so a pin
# bump without regenerated bindings cannot land silently.
headers_sha256 = "8eff67afab1344ecdd4b005c1f95abcf9f19df000572393e8e7b11fc7eedaef5"

# Per-target sha256 of the prebuilt libghostty-vt release assets
# (libghostty-vt-<commit10>-<target>.tar.gz), the sole build-time trust root
# for the default prebuilt fetch. Stamped from the release's SHA256SUMS after
# `gh attestation verify` (bump procedure: build-strategy.md §7).
#
# INTERIM: empty until the artifact pipeline publishes `release` (ticket
# #39). While empty, the default path falls back to a pinned source build
# with a warning; the first stamped hash makes that fallback unreachable.
[sha256]
