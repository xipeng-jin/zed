[package]
name = "ghostty_vt"
version = "0.1.0"
description = "Safe Rust API for libghostty-vt, the Ghostty terminal emulation library"
edition.workspace = true
publish.workspace = true
license = "MIT"

[lints]
workspace = true

[lib]
path = "src/ghostty_vt.rs"

[features]
# `kitty-graphics` is deliberately NOT a default: the pinned prebuilt and
# every source build are trimmed with `-Dvt-features=-kitty_graphics,...`
# (see ghostty_pin.toml), so enabling it would fail at link time.
default = []
allocator_api = ["dep:allocator-api2"]
kitty-graphics = ["ghostty_vt_sys/kitty-graphics"]
png = ["dep:png"]
log = ["dep:log"]
tracing = ["dep:tracing"]

[dependencies]
allocator-api2 = { version = "0.4.0", optional = true }
bitflags.workspace = true
ghostty_vt_sys.workspace = true
int-enum.workspace = true
png = { version = "0.18.1", optional = true }
log = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
ghostty_vt_sys.workspace = true
