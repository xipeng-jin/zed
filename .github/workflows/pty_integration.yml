# P4 acceptance gate (docs/ghostty-migration/SPEC.md §6): the PTY integration
# suite (spawn/resize/kill/exit) must be green on Linux and Windows CI,
# including the §8.2 ConPTY shutdown/exit/kill tests. Linux runs the full
# terminal crate suite (the Class B proof rides along); Windows runs the PTY
# seam suite against real ConPTY.
#
# Hand-written (not xtask-generated): it must run on this fork, where the
# xtask-generated workflows are guarded to zed-industries and use Namespace
# runners. Fold into run_tests.rs when the migration upstreams.
name: pty_integration
on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
      - migration/libghostty
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
jobs:
  terminal_tests_linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: install linux dependencies
        run: ./script/linux
      - name: cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pty-integration-linux-${{ hashFiles('Cargo.lock') }}
      - name: run terminal crate tests (includes the PTY integration suite)
        run: cargo test -p terminal --lib
  conpty_tests_windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # cargo's bundled libgit2 cannot handle > MAX_PATH checkout paths (the
      # python-environment-tools test fixtures exceed it); the git CLI with
      # core.longpaths can. Upstream's self-hosted runners preconfigure this.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: enable git long paths
        run: git config --global core.longpaths true
        shell: pwsh
      - name: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: setup cargo config
        run: |
          New-Item -ItemType Directory -Path "./../.cargo" -Force
          Copy-Item -Path "./.cargo/ci-config.toml" -Destination "./../.cargo/config.toml"
        shell: pwsh
      - name: cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pty-integration-windows-${{ hashFiles('Cargo.lock') }}
      - name: build test binary
        run: cargo test -p terminal --lib --no-run
        shell: pwsh
      # Pin the ConPTY provider: the Server 2022 in-box conhost is
      # nondeterministically broken under this workload (sessions deliver only
      # a VT preamble — ledger P4-001), so sideload a modern
      # OpenConsole/conpty next to the test binary, portable-pty's preferred
      # path and the configuration wezterm itself ships. The in-box-conhost
      # question belongs to the §8.2 gate on real hardware.
      - name: sideload modern ConPTY host
        run: |
          $release = "20240203-110809-5046fc22"
          Invoke-WebRequest -Uri "https://github.com/wezterm/wezterm/releases/download/$release/WezTerm-windows-$release.zip" -OutFile wezterm.zip
          Expand-Archive wezterm.zip -DestinationPath wezterm-sideload
          $dir = Get-ChildItem wezterm-sideload | Select-Object -First 1
          Copy-Item "$($dir.FullName)\conpty.dll" target\debug\deps\
          Copy-Item "$($dir.FullName)\OpenConsole.exe" target\debug\deps\
        shell: pwsh
      # Serial: concurrent ConPTY spawns in one process contend on conhost
      # startup and pipe-handle inheritance, starving whole sessions of
      # output. Production spawns terminals one at a time from the foreground.
      - name: run PTY seam suite against ConPTY
        run: "cargo test -p terminal --lib pty:: -- --test-threads=1"
        shell: pwsh
      - name: cleanup cargo config
        if: always()
        run: |
          Remove-Item -Recurse -Path "./../.cargo" -Force -ErrorAction SilentlyContinue
        shell: pwsh
